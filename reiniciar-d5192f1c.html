<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Reiniciar sorteo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@400;600;800&display=swap">
<style>
:root{--bg:#eaf3f7;--card:#fff;--fg:#14303d;--muted:#5b7684;--ice:#cfe7f1;--shelf:#e4f1f6;--danger:#d93a2b;--danger-fg:#fff;--ok:#1f9d6b;
  --display:"Fredoka",system-ui,sans-serif;--body:"Nunito",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#0d1b22;--card:#15282f;--fg:#e4f2f7;--muted:#8fb0bd;--ice:#1d3a46;--shelf:#1a333d;--danger:#ff6a5a;--danger-fg:#1a0806;--ok:#3cc78f;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
.wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-size:1.7rem;margin:0;line-height:1.1}
p{margin:0}.muted{color:var(--muted)}
.card{background:var(--card);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
li{background:var(--shelf);border-radius:12px;padding:10px 14px;font-weight:800;display:flex;justify-content:space-between;gap:8px}
li span{color:var(--muted);font-weight:600;font-size:.85rem}
li.none{color:var(--muted);font-weight:600;font-style:italic}
button{font:inherit;cursor:pointer;border:0;width:100%;border-radius:14px;padding:14px;font-family:var(--display);font-size:1.15rem;font-weight:600}
.danger{background:var(--danger);color:var(--danger-fg)}
.ghost{background:transparent;border:2px solid var(--ice);color:var(--muted);font-size:1rem}
button:disabled{opacity:.5;cursor:default}
button:focus-visible{outline:3px solid #ffd36b;outline-offset:2px}
.msg{font-weight:800;text-align:center}
.msg.ok{color:var(--ok)}
a{color:inherit}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔧 Reiniciar el sorteo</h1>
  <p class="muted">Página del organizador. No compartas este enlace.</p>

  <section class="card">
    <p><b>Apuntados ahora:</b> <span id="count">…</span></p>
    <ul id="list"><li class="none">Conectando…</li></ul>
  </section>

  <section class="card">
    <p class="muted">Al reiniciar se borran todos los apuntados y el resultado. Todos tendrán que volver a entrar al link y apuntarse otra vez.</p>
    <button class="danger" id="resetBtn">Reiniciar el sorteo</button>
    <div id="confirm" hidden style="display:flex;flex-direction:column;gap:8px">
      <p class="msg">¿Seguro? Esto no se puede deshacer.</p>
      <button class="danger" id="yesBtn">Sí, borrar todo y empezar de cero</button>
      <button class="ghost" id="noBtn">Cancelar</button>
    </div>
    <p class="msg" id="msg" hidden></p>
  </section>

  <p class="muted" style="text-align:center"><a href="./">Ir al sorteo</a></p>
</div>
<script>
const TOPIC="nevera-3efe546de00e", N=5;
const $=id=>document.getElementById(id);
let events=[]; const seen=new Set();
function state(){
  let start=0; events.forEach((e,i)=>{ if(e.t==="reset") start=i+1; });
  const list=[], by={};
  for(const e of events.slice(start)){
    if(e.t==="join"&&!by[e.dev]&&e.name){const p={name:String(e.name).slice(0,24),ready:false};by[e.dev]=p;list.push(p);}
    else if(e.t==="leave"&&by[e.dev]&&!by[e.dev].ready){list.splice(list.indexOf(by[e.dev]),1);delete by[e.dev];}
    else if(e.t==="ready"&&by[e.dev]&&list.indexOf(by[e.dev])<N){by[e.dev].ready=true;}
  }
  return list;
}
function render(){
  const ps=state().slice(0,N), ul=$("list"); ul.textContent="";
  $("count").textContent=ps.length+"/"+N;
  if(!ps.length){const li=document.createElement("li");li.className="none";li.textContent="Nadie todavía";ul.append(li);return;}
  ps.forEach(p=>{const li=document.createElement("li");li.textContent=p.name;const s=document.createElement("span");s.textContent=p.ready?"listo ✓":"esperando";li.append(s);ul.append(li);});
}
let t=null;
const es=new EventSource(`https://ntfy.sh/${TOPIC}/sse?since=all`);
es.onopen=()=>setTimeout(render,600);
es.onmessage=m=>{try{const d=JSON.parse(m.data);if(d.event!=="message"||seen.has(d.id))return;seen.add(d.id);events.push(JSON.parse(d.message));clearTimeout(t);t=setTimeout(render,50);}catch(e){}};
$("resetBtn").onclick=()=>{$("resetBtn").hidden=true;$("confirm").hidden=false;$("msg").hidden=true;};
$("noBtn").onclick=()=>{$("resetBtn").hidden=false;$("confirm").hidden=true;};
$("yesBtn").onclick=async()=>{
  $("yesBtn").disabled=true;
  try{
    const r=await fetch("https://ntfy.sh/"+TOPIC,{method:"POST",body:JSON.stringify({t:"reset"})});
    if(!r.ok) throw 0;
    $("msg").textContent="✓ Sorteo reiniciado. Ya se pueden volver a apuntar."; $("msg").className="msg ok";
  }catch(e){ $("msg").textContent="No se pudo reiniciar. Revisa tu conexión e inténtalo otra vez."; $("msg").className="msg"; }
  $("msg").hidden=false; $("confirm").hidden=true; $("resetBtn").hidden=false; $("yesBtn").disabled=false;
};
</script>
</body>
</html>
